name: Verify local application
on:
  push:
    paths-ignore:
      - 'experiments/**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run browser:replay
      - run: npm run validate:science
      - run: npm run build
      # Compact CC-BY processed graphs are in source control. Re-downloading
      # the RDS or any raw microscopy data is unnecessary for CI.
  browser-causality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:validate -- --fast
      - run: npm run exhibit:validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-causality-evidence
          path: |
            runtime/browser/
            runtime/exhibit-validation/
          retention-days: 14
  desktop-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo bash scripts/setup-desktop.sh
      - run: npm run desktop:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-calibration
          path: runtime/desktop-optics/
          retention-days: 14
